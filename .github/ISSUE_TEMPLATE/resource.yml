name: 资料推荐
description: 推荐一个适合收录的资料、案例或平台文档
title: "[资源] "
labels: ["resource"]
body:
  - type: input
    id: url
    attributes:
      label: 链接
      description: 资料、案例或官方文档链接
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 推荐理由
      description: 它解决什么问题，适合放到哪个章节？
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 资料时间
      description: 如果能判断，请写发布时间或最后更新时间
